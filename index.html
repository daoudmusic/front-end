<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billets Daoud</title>
  <style>
    body {
      font-family: sans-serif;
      text-transform: uppercase;
      background: #fff;
      color: #000;
      text-align: center;
      padding: 2rem;
    }
    form {
      max-width: 400px;
      margin: auto;
    }
    input, select {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.75rem;
      border: 1px solid #000;
    }
    button {
      background: #000;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #fff;
      color: #000;
      border: 1px solid #000;
    }
  </style>
</head>
<body>
  <h1>acheter un billet</h1>
  <form id="ticketForm">
    <input name="name" placeholder="votre nom" required />
    <input type="email" name="email" placeholder="votre email" required />
    <input name="phone" placeholder="téléphone" required />
    <select name="quantity" required>
      <option value="1">1 billet</option>
      <option value="2">2 billets</option>
      <option value="3">3 billets</option>
      <option value="4">4 billets</option>
      <option value="5">5 billets</option>
      <option value="6">6 billets</option>
      <option value="7">7 billets</option>
      <option value="8">8 billets</option>
    </select>
    <input type="hidden" name="eventId" value="concert_paris_may2" />
    <input type="hidden" name="price" value="60" />
    <button type="submit">acheter</button>
    <p id="ticketStatus"></p>
  </form>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("ticketForm");
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const quantity = parseInt(form.quantity.value);
        const price = parseFloat(form.price.value);
        const payload = {
          name: form.name.value,
          email: form.email.value,
          phone: form.phone.value,
          quantity,
          eventId: form.eventId.value,
          value: quantity * price,
        };

        const res = await fetch("https://daoud-backend.vercel.app/api/submit-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const status = document.getElementById("ticketStatus");
        if (res.ok) {
          status.textContent = "✅ billet envoyé par email !";
        } else {
          status.textContent = "❌ une erreur est survenue.";
        }
      });
    });
  </script>
</body>
</html>
